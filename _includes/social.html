<ul class="social-media-list">
  {%- if site.scholar -%}
    <li>
      <a href="{{ site.scholar }}">
        <img class="svg-icon" src="{{ '/assets/icons/scholar.svg' | relative_url }}" style="filter: grayscale(1) opacity(1.0);" alt="Google Scholar icon">
        <span class="username">Google Scholar</span>
      </a>
    </li>
  {%- endif -%}

  {%- if site.github_username -%}
    <li>
      <a href="https://github.com/{{ site.github_username| cgi_escape | escape }}">
        <svg class="svg-icon"><use xlink:href="{{ '/assets/minima-social-icons.svg#github' | relative_url }}"></use></svg>
        <span class="username">GitHub</span>
      </a>
    </li>
  {%- endif -%}

  {%- if site.linkedin_username -%}
    <li>
      <a href="https://www.linkedin.com/in/{{ site.linkedin_username| cgi_escape | escape }}">
        <svg class="svg-icon"><use xlink:href="{{ '/assets/minima-social-icons.svg#linkedin' | relative_url }}"></use></svg>
        <span class="username">LinkedIn</span>
      </a>
    </li>
  {%- endif -%}

  {%- if site.orcid -%}
    <li>
      <a href="https://orcid.org/{{ site.orcid }}">
        <img class="svg-icon" src="{{ '/assets/icons/orcid.svg' | relative_url }}" style="filter: grayscale(1) opacity(.5);" alt="ORCID iD icon">
        <span class="username">ORCID</span>
      </a>
    </li>
  {%- endif -%}

</ul>
