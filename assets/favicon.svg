<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="atom-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a7ae2" />
      <stop offset="100%" stop-color="#114b9a" />
    </linearGradient>
  </defs>
  <!-- Central nucleus -->
  <circle cx="16" cy="16" r="3.5" fill="url(#atom-grad)" />
  <!-- Atomic orbitals -->
  <ellipse cx="16" cy="16" rx="14" ry="5.5" fill="none" stroke="url(#atom-grad)" stroke-width="1.8" />
  <ellipse cx="16" cy="16" rx="14" ry="5.5" fill="none" stroke="url(#atom-grad)" stroke-width="1.8" transform="rotate(60 16 16)" />
  <ellipse cx="16" cy="16" rx="14" ry="5.5" fill="none" stroke="url(#atom-grad)" stroke-width="1.8" transform="rotate(120 16 16)" />
</svg>
